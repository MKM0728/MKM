plugins {
    id 'java'
    id 'application'
}

group = 'com.roguelike'
version = '0.1.0'

repositories {
    mavenCentral()
}

def javafxVersion = '20'
def javafxPlatform = System.properties['os.name'].toLowerCase().contains('win') ? 'win' :
                      System.properties['os.name'].toLowerCase().contains('mac') ? 'mac' : 'linux'

dependencies {
    // Force platform-specific JavaFX (FXGL's transitive deps lack classifier)
    implementation platform("org.openjfx:javafx-base:${javafxVersion}")
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}"

    implementation 'com.github.almasb:fxgl:17.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.roguelike.core.GameApp'
}

test {
    useJUnitPlatform()
}

tasks.register('fatJar', Jar) {
    archiveBaseName = 'roguelike-dungeon'
    archiveVersion = version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    with jar
}
