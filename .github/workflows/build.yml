name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Compile
        run: gradle compileJava --info 2>&1 | tail -100
      - name: Test
        run: gradle test --stacktrace 2>&1
      - name: Package
        run: gradle fatJar --stacktrace 2>&1
