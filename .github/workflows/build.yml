name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew && ./gradlew test shadowJar
      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-dungeon-jar
          path: build/libs/*.jar

  package-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: .\gradlew.bat shadowJar
      - name: Package standalone .exe
        shell: powershell
        run: |
          jpackage `
            --name "RoguelikeDungeon" `
            --input "build\libs" `
            --main-jar "roguelike-dungeon-0.1.0.jar" `
            --main-class "com.roguelike.core.GameApp" `
            --type app-image `
            --dest "build\dist" `
            --app-version "0.1.0" `
            --vendor "rullerzhou" `
            --description "2D Pixel Roguelike" `
            --win-console
      - name: ZIP
        run: Compress-Archive -Path "build\dist\RoguelikeDungeon\*" -DestinationPath "RoguelikeDungeon-windows.zip"
      - name: Upload .exe package
        uses: actions/upload-artifact@v4
        with:
          name: RoguelikeDungeon-Windows
          path: RoguelikeDungeon-windows.zip
