name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew test

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew shadowJar
      - name: Package as standalone Windows app
        run: |
          jpackage `
            --name "RoguelikeDungeon" `
            --input "build\libs" `
            --main-jar "roguelike-dungeon-0.1.0.jar" `
            --main-class "com.roguelike.core.GameApp" `
            --type app-image `
            --dest "build\dist" `
            --app-version "0.1.0" `
            --vendor "rullerzhou" `
            --description "2D Pixel Roguelike Dungeon Crawler" `
            --win-console
      - name: ZIP the app
        run: Compress-Archive -Path "build\dist\RoguelikeDungeon\*" -DestinationPath "build\dist\RoguelikeDungeon-windows.zip"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RoguelikeDungeon-Windows
          path: build/dist/RoguelikeDungeon-windows.zip

  release:
    needs: package-windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoguelikeDungeon-Windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "Roguelike Dungeon v0.1.0"
          body: |
            ## Download & Play (No Java Required!)

            1. Download `RoguelikeDungeon-windows.zip`
            2. Extract anywhere
            3. Double-click `RoguelikeDungeon.exe`

            Built with Java 17 + FXGL. Everything is bundled - no installation needed.
          files: RoguelikeDungeon-windows.zip
